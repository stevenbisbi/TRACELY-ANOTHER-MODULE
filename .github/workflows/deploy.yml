name: Deploy a VPS

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            web:
              - 'web/**'

  deploy:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy cambios a la VPS
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_WEB: ${{ needs.changes.outputs.web }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_BACKEND,DEPLOY_WEB
          script: |
            set -e
            cd /var/www/Tracely
            git fetch origin main
            git checkout main
            git pull origin main

            if [ "$DEPLOY_BACKEND" = "true" ]; then
              echo "== backend cambio: reconstruyendo contenedor =="
              cd backend
              docker compose up -d --build
              cd ..
            fi

            if [ "$DEPLOY_WEB" = "true" ]; then
              echo "== web cambio: reconstruyendo build estatico =="
              cd web
              npm install
              npm run build
              cd ..
            fi
