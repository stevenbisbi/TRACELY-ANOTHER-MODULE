# Front (SPA estatica, build de Vite) — tracely.e-posgt.com
# certbot --nginx agrega el bloque de :443 y el redirect automaticamente.
server {
    listen 80;
    server_name tracely.e-posgt.com;

    root /var/www/Tracely/web/dist;
    index index.html;

    # react-router-dom usa rutas del lado del cliente: cualquier ruta que no
    # sea un archivo real cae en index.html para que el router la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
